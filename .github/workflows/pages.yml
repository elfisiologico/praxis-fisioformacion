name: Publicar Praxis
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '10 3 * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
          ENROLLMENT_ALERT_ENDPOINT: ${{ vars.ENROLLMENT_ALERT_ENDPOINT }}
          ENROLLMENT_ALERT_PRIVACY_URL: ${{ vars.ENROLLMENT_ALERT_PRIVACY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Esperar a que GitHub registre el artefacto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages" and (.expired | not)) | .id' | grep -q .; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::El artefacto de Pages todavía no aparece en GitHub Actions"
          exit 1
      - id: deploy
        uses: actions/deploy-pages@v4
